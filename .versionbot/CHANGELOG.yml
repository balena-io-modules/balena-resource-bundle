    - subject: Embed image manifests in base64 form
      hash: b6e3db9ed0980e63f4f155f08ace9ae44b4e4f26
      body: >
        Include image manifests in base64 form when fetching images from a
        registry. The original manifest must be retained to enable pushing
        images back to a registry. When the image reference is in sha256 form,
        it is equivalent to the original manifest checksum.
